openapi: 3.0.3
info:
  title: AI Meeting Intelligence Portal API
  version: 0.1.0
  description: >
    AI Meeting Intelligence Portal 的後端 API 規格,對應前端 mockup 的六個區塊:
    Upload Transcript、Meeting Summary、Decisions、Action Items、Risks、Search。
    這份 spec 是 Lab 4 的輸入,用來示範「用 Skill 包 datamodel-codegen 工具」產生
    FastAPI router 骨架與 Pydantic model 的做法。

paths:
  /transcripts:
    post:
      operationId: uploadTranscript
      summary: 上傳一份會議逐字稿
      tags: [transcripts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptUploadRequest'
      responses:
        '201':
          description: 上傳成功,回傳建立好的 meeting id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptUploadResponse'

  /meetings/{meetingId}/summary:
    get:
      operationId: getMeetingSummary
      summary: 取得指定會議的摘要與決議
      tags: [meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: 成功回傳摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingSummary'
        '404':
          description: 找不到指定的會議
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meetings/{meetingId}/action-items:
    get:
      operationId: getActionItems
      summary: 取得指定會議的待辦事項清單
      tags: [meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: 成功回傳待辦事項清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionItem'
        '404':
          description: 找不到指定的會議
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meetings/{meetingId}/risks:
    get:
      operationId: getMeetingRisks
      summary: 取得指定會議的風險項目清單
      tags: [meetings]
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: 成功回傳風險項目清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Risk'
        '404':
          description: 找不到指定的會議
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search:
    get:
      operationId: searchTranscripts
      summary: 依關鍵字搜尋逐字稿內容
      tags: [search]
      parameters:
        - name: meetingId
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          description: 搜尋關鍵字
          schema:
            type: string
      responses:
        '200':
          description: 成功回傳搜尋結果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'

components:
  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string

  schemas:
    TranscriptUploadRequest:
      type: object
      required: [title, meetingDate, rawText]
      properties:
        title:
          type: string
        meetingDate:
          type: string
          format: date
        rawText:
          type: string

    TranscriptUploadResponse:
      type: object
      required: [meetingId]
      properties:
        meetingId:
          type: string

    MeetingSummary:
      type: object
      required: [meetingId, summary, decisions, generatedAt]
      properties:
        meetingId:
          type: string
        summary:
          type: string
        decisions:
          type: array
          items:
            type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
          description: 會議整體氛圍
        generatedAt:
          type: string
          format: date-time
          description: 摘要產生時間(UTC)

    ActionItem:
      type: object
      required: [owner, action, priority]
      properties:
        owner:
          type: string
        action:
          type: string
        dueDate:
          type: string
          format: date
          nullable: true
        priority:
          type: string
          enum: [High, Medium, Low]

    Risk:
      type: object
      required: [label]
      properties:
        label:
          type: string
        detail:
          type: string
          nullable: true

    SearchResult:
      type: object
      required: [speaker, excerpt, matchType]
      properties:
        speaker:
          type: string
        excerpt:
          type: string
        matchType:
          type: string
          enum: [literal, semantic]

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
