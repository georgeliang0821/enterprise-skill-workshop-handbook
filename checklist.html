<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開課前環境自檢表 · Enterprise Skill Engineering Workshop</title>
<style>
:root{
  --accent:#4338A6; --accent-2:#1E2761; --accent-soft:#ECEBF8;
  --bg:#ffffff; --bg-side:#f8f8fb; --text:#222a35; --muted:#5b6472;
  --border:#e4e3ee; --code-bg:#f4f4f9; --code-text:#1f2733; --th-bg:#eeeef6;
}
:root[data-theme="dark"]{
  --accent:#9b8fe6; --accent-2:#9fb0e6; --accent-soft:#1e1b33;
  --bg:#16161b; --bg-side:#1b1b22; --text:#d7dce3; --muted:#8a93a1;
  --border:#2e2c3a; --code-bg:#0e0e13; --code-text:#d7dce3; --th-bg:#222231;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.78;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:34px 24px 100px}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;text-decoration:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
.hero{border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:8px}
.hero-eyebrow{color:var(--accent);font-weight:700;letter-spacing:.04em;font-size:13.5px}
.hero-title{font-size:34px;margin:6px 0 10px;color:var(--accent-2);line-height:1.2}
h1,h2{color:var(--accent-2);line-height:1.25}
h1{font-size:32px;margin:24px 0 12px}
h2{font-size:24px;margin:40px 0 12px;padding-top:8px;border-top:1px solid var(--border)}
h3{font-size:18px;color:var(--text);margin:24px 0 8px}
p{margin:10px 0}
a{color:var(--accent)}
strong{color:var(--text);font-weight:700}
[data-theme="dark"] strong{color:#f0f3fa}
code{background:var(--code-bg);color:#3f33a0;font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:.88em;padding:1.5px 6px;border-radius:5px}
[data-theme="dark"] code{color:#b3a8f0}
pre{margin:14px 0;border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;background:var(--code-bg);color:var(--code-text)}
pre code{background:none;color:inherit;padding:0;font-size:13px;line-height:1.7;white-space:pre}
ul,ol{padding-left:24px}li{margin:5px 0}
.task-list-item{list-style:none;margin-left:-22px}
.task-list-item input{width:17px;height:17px;accent-color:var(--accent);vertical-align:-3px;margin-right:8px}
blockquote{margin:12px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--bg-side);border-radius:0 8px 8px 0}
blockquote p{margin:0;color:var(--muted);font-size:14.5px}
hr{border:none;border-top:1px solid var(--border);margin:34px 0}
.loading{color:var(--muted);padding:20px 0}
@media(max-width:720px){.wrap{padding:24px 18px 80px}.hero-title{font-size:27px}h1{font-size:26px}}
@media print{.topbar{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="icon-btn" href="index.html">← 回入口頁</a>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" type="button">🌓 深/淺色</button>
  </div>

  <header class="hero">
    <div class="hero-eyebrow">GitHub Copilot · Enterprise Skill Engineering Workshop</div>
    <h1 class="hero-title">開課前環境自檢表</h1>
  </header>

  <main id="content" class="loading">載入自檢表...</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  var root=document.documentElement;
  var saved=localStorage.getItem('handbook-theme');
  if(saved){root.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){
    root.setAttribute('data-theme','dark');
  }
  document.getElementById('themeBtn').addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    localStorage.setItem('handbook-theme',next);
  });
  fetch('checklist.md')
    .then(function(response){
      if(!response.ok){throw new Error('HTTP '+response.status);}
      return response.text();
    })
    .then(function(markdown){
      marked.setOptions({gfm:true,breaks:false});
      var content=document.getElementById('content');
      content.classList.remove('loading');
      content.innerHTML=marked.parse(markdown);
    })
    .catch(function(error){
      document.getElementById('content').textContent='自檢表載入失敗:'+error.message;
    });
})();
</script>
</body>
</html>
